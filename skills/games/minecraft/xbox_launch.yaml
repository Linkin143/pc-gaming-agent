# Minecraft launch skills - the pre-game Xbox app flow.
# These are game_specific desktop skills; the desktop layer (winapp.py) performs
# the actual UIA3 actions. They exist so the flow is skill-driven and logged.
skills:
  - skill: xbox_open_app
    game: minecraft
    category: game_specific
    description: Launch the Xbox PC application.
    preconditions: []
    perception:
      - screenshot
      - ocr
    parameters: {}
    action_strategy: game_specific
    expected_result: xbox_app_open
    verification:
      expected_state: xbox_app
    verification_strategy: text_present
    timeout_ms: 45000
    retry:
      max_attempts: 2
      backoff_ms: 2000
    recovery:
      - reobserve
      - retry

  - skill: xbox_maximize
    game: minecraft
    category: game_specific
    description: Maximise the Xbox app window so all controls are visible.
    preconditions:
      - "state.screen == xbox_app"
    perception:
      - screenshot
    parameters: {}
    action_strategy: game_specific
    expected_result: window_maximized
    verification_strategy: none
    timeout_ms: 6000
    retry:
      max_attempts: 2
      backoff_ms: 500
    recovery:
      - retry

  - skill: xbox_search_game
    game: minecraft
    category: game_specific
    description: Search the Xbox app for "Minecraft for Windows".
    preconditions:
      - "state.screen == xbox_app"
    perception:
      - screenshot
      - ocr
    parameters:
      query:
        type: string
        default: Minecraft for Windows
    action_strategy: game_specific
    expected_result: results_shown
    verification_strategy: text_present
    timeout_ms: 10000
    retry:
      max_attempts: 2
      backoff_ms: 1000
    recovery:
      - reobserve
      - retry

  - skill: xbox_select_installed_game
    game: minecraft
    category: game_specific
    description: Click the installed Minecraft entry and open its game card.
    preconditions:
      - "state.screen == xbox_app"
    perception:
      - screenshot
      - ocr
      - vision
    parameters:
      name:
        type: string
        default: Minecraft
    action_strategy: game_specific
    expected_result: game_card_open
    verification_strategy: text_present
    timeout_ms: 10000
    retry:
      max_attempts: 3
      backoff_ms: 1000
    recovery:
      - reobserve
      - escalate_vlm
      - retry

  - skill: xbox_click_play
    game: minecraft
    category: game_specific
    description: Tap the Play/Launch button on the Minecraft game card.
    preconditions:
      - "state.screen == xbox_app"
    perception:
      - screenshot
      - ocr
    parameters: {}
    action_strategy: game_specific
    expected_result: game_launching
    verification:
      expected_state: game_loading
    verification_strategy: screen_transition
    timeout_ms: 20000
    retry:
      max_attempts: 3
      backoff_ms: 2000
    recovery:
      - reobserve
      - escalate_vlm
      - retry

  - skill: xbox_launch_minecraft
    game: minecraft
    category: game_specific
    description: >
      Full launch macro - open Xbox, maximise, search, select installed game,
      open card, and click Play, then wait for the game window.
    preconditions: []
    perception:
      - screenshot
      - ocr
      - vision
    parameters: {}
    action_strategy: game_specific
    expected_result: minecraft_launched
    verification:
      expected_state: main_menu
    verification_strategy: screen_transition
    timeout_ms: 120000
    retry:
      max_attempts: 2
      backoff_ms: 3000
    recovery:
      - reobserve
      - escalate_vlm
      - retry
      - return_to_known_state

# ==================================================================== #
# DECLARATIVE LAUNCH STATE MACHINE (read by agents/launch/launch_agent.py)
#
# The launch is NOT a fixed sequence of timed steps. Every iteration the
# LaunchAgent captures the live screen, runs OpenCV (crosshair) + OCR, and
# picks the FIRST state below whose `detect` conditions all match the real
# screen. It then performs that state's `action` (locating click targets via
# OCR at run time, never hard-coded pixels) and re-observes. Slow app launch
# or menu rendering simply means `detect` keeps matching the same state until
# the screen actually changes - no blind sleeps.
#
# detect / done_when condition keys (all optional; ALL listed must hold):
#   window_present : substring that must appear in a visible window title
#   window_absent  : substring that must NOT appear in any window title
#   any_text       : list; at least ONE must be in the on-screen OCR text
#   all_text       : list; ALL must be present in the OCR text
#   not_text       : list; NONE may be present in the OCR text
#   crosshair      : true/false - MinecraftVision pixel crosshair (in-world)
#
# action.op values: launch_xbox | search | click_text | click_world | wait | done
# When the agent cannot match ANY state for `confuse_limit` cycles it escalates
# to the VLM/LLM to classify the frame and decide (screen is the source of
# truth; the LLM only arbitrates genuine ambiguity).
# ==================================================================== #
launch_config:
  # Timing is PROGRESS-based, not a fixed schedule. `stall_timeout_s` is the
  # only real limit: the launch aborts ONLY if no state transition happens for
  # this many seconds. A slow-but-advancing launch is never killed. OCR is
  # warmed up before the timer starts so its ~40-50s cold-start is free.
  stall_timeout_s: 180      # give up only after this long with NO progress
  hard_cap_s: 1500          # absolute safety net (25 min) - generous headroom so
                            # a legitimately slow launch+world-load is never cut
                            # off right as it enters the world.
  poll_interval_s: 0.5      # inter-cycle pause; small now that OCR is ~1-2s (was
                            # 1.5 when each cycle was ~40s and the wait was noise)
  confuse_limit: 3          # consecutive unmatched cycles before LLM/VLM help
  max_same_state_actions: 8 # abort a state that fires this many actions w/o transition
  # After entering a world, poll for the crosshair cheaply (no OCR/VLM) so the
  # in-world transition is confirmed within seconds instead of a full slow cycle.
  world_enter_polls: 20     # up to 20 checks
  world_enter_poll_s: 3.0   # 3s apart => ~60s window for the world to render
  # After clicking Play on title screen, poll for crosshair to confirm transition
  title_click_polls: 8      # up to 8 checks
  title_click_poll_s: 1.0   # 1s apart => ~8s window for world select to appear
  # Every cycle fuses OpenCV (L1) + OCR/crosshair (L2). The VLM (L3, ~40s) is
  # called ONLY when OCR did not confidently match a declarative state, the fused
  # confidence is below this, or the matched state needs a world-name hint
  # (click_world). A confident declarative OCR match skips the VLM entirely, so
  # clear frames add no VLM latency (this roughly halves total launch time).
  vlm_threshold: 0.75
  # Circuit breaker: after this many consecutive VLM call failures (e.g. a bad
  # model name returning 404), the VLM is disabled for the rest of the run and
  # the launch continues OCR-only instead of looping on failing API calls.
  vlm_max_failures: 3
  # Motion-gated OCR bypass: if the frame's normalised pixel-change vs the last
  # cycle is below this, the on-screen text is unchanged so we reuse the previous
  # OCR text and skip the scan entirely (the "NO SIGNIFICANT CHANGE" branch).
  ocr_change_threshold: 0.006
  search_query: minecraft for windows
  window_xbox: XBOX
  window_game: Minecraft

# States are evaluated top-to-bottom; the FIRST whose `detect` fully matches
# wins. They are therefore ordered MOST-SPECIFIC / most-authoritative first:
# the pixel crosshair (in-world truth) -> Minecraft menu screens -> Xbox app
# screens -> the desktop fallback last. This ordering is what makes detection
# unambiguous - e.g. a running Minecraft never falls through to `desktop`.
launch_states:
  - name: in_world
    description: Crosshair visible - we are in the game world (terminal, wins over all).
    detect:
      crosshair: true
    action:
      op: done

  - name: loading
    description: A world is loading; wait and re-observe.
    detect:
      window_present: Minecraft
      any_text: ["loading", "generating", "building terrain", "locating"]
      crosshair: false
    action:
      op: wait
      ms: 3000
    done_when:
      crosshair: true

  - name: world_select
    description: World-select screen - choose or create a world.
    detect:
      window_present: Minecraft
      any_text: ["create new", "worlds", "play world", "friends"]
      crosshair: false
    action:
      op: click_world
    done_when:
      crosshair: true

  - name: mc_title
    description: Minecraft (Bedrock) title screen - Marketplace/Play visible.
    skip_vlm: true   # unambiguous OCR match; VLM confirmation adds only latency
    detect:
      window_present: Minecraft
      any_text: ["marketplace", "singleplayer", "play"]
      crosshair: false
    action:
      op: click_text
      targets: ["play"]
      # Guard against marketplace/promo text that CONTAINS "play" as a substring
      # (e.g. "AI Players Add-On", "...while you play") or near-miss labels, so a
      # frame where the real Play button isn't cleanly read can't fall through to
      # clicking a marketplace tile. The real button reads as "Play"/"Flay" (a
      # short standalone label) and still matches via the exact/fuzzy tiers.
      exclude: ["players", "add-on", "add on", "marketplace",
                "dressing", "settings", "unlock"]
      # Minecraft's title-screen Play button takes 2-5 seconds to navigate and
      # render the world-select list. Without this settle wait the next OCR cycle
      # fires immediately, still sees the title text, and re-clicks Play - burning
      # the same-state action budget instead of detecting the transition.
      post_click_ms: 4000
    done_when:
      any_text: ["create new", "worlds", "friends", "play world"]

  - name: game_card
    description: Minecraft game card open in the Xbox app with a Play/Launch button.
    skip_vlm: true   # unambiguous OCR match; VLM confirmation adds only latency
    detect:
      window_present: XBOX
      all_text: ["minecraft"]      # the card must actually be showing Minecraft
      any_text: ["play", "launch"] # AND a Play/Launch button must be present
      # The search-results page ALSO shows "minecraft" + a "Play with Game Pass"
      # heading, so it used to false-match this state and loop forever clicking a
      # non-navigating heading. Block any screen that is still a results listing.
      not_text: ["search results", "results for"]
    action:
      op: click_text
      targets: ["play", "launch", "resume"]
      # "with game pass" / "game pass" guard the section heading that is NOT a
      # launch button; the others are unrelated words containing "play".
      exclude: ["replay", "gameplay", "with game pass", "game pass"]
      # The Xbox game-card Play button needs a couple of seconds after the card
      # renders before the click registers and Minecraft begins launching.
      # Without this settle wait the next cycle re-detects game_card, re-clicks
      # the same (not-yet-live) button, and burns the same-state action budget -
      # the exact 8-cycle stall seen in launch_20260925_143932.
      post_click_ms: 3000
    done_when:
      window_present: Minecraft

  - name: search_results
    description: Search returned; the Minecraft card is visible but not opened.
    skip_vlm: true   # unambiguous OCR match; VLM confirmation adds only latency
    detect:
      window_present: XBOX
      any_text: ["minecraft"]
      # game_card (above) now claims real game-card pages via its own not_text
      # guard, so search_results no longer needs to exclude "play"/"launch"
      # (which broke on the "Play with Game Pass" heading of the results page).
      not_text: ["marketplace"]
    action:
      op: click_text
      targets: ["minecraft for windows", "minecraft launcher", "minecraft"]
      exclude: ["legends", "dungeons", "education", "trial",
                "search results", "results for"]
    done_when:
      any_text: ["play", "launch", "installed"]

  - name: game_launching
    skip_vlm: true   # blank/transitional screen - the VLM has nothing to read
    description: >
      Xbox app is on a transitional/blank screen (Minecraft is starting) - no
      home content and no game card yet. Just wait and re-observe; do NOT start
      a new search here (that was the old false-positive that looped back).
    detect:
      window_present: XBOX
      # Once the Minecraft window appears (even during loading), we must NOT match
      # this state. The Minecraft window (loading screen) should be handled by the
      # 'loading' state above. Excluding Minecraft here prevents the false match
      # that occurred when OCR found no text on the loading screen.
      window_absent: ["Minecraft"]
      # NOTE: "launch" is deliberately NOT excluded here - the Xbox startup
      # splash literally reads "Launching XBOX" (contains "launch"), and we want
      # this state to claim that transitional screen and wait rather than falling
      # through to xbox_home and firing a premature search.
      # Home-page markers ("jump back in", "featured", "recently added") keep the
      # Xbox HOME page from being mistaken for the blank launching screen - that
      # mislabel made the agent "wait" forever on the home page after a click that
      # missed the Minecraft tile. OCR sometimes misreads "MINECRAFT" as "MIMECRAFT"
      # so we do not rely on the "minecraft" token alone to exclude the home page.
      not_text: ["minecraft", "play", "marketplace",
                 "store", "library", "home", "game pass",
                 "jump back in", "featured", "recently added", "discover"]
    action:
      op: wait
      ms: 1500          # shorter re-observe interval; the perception cycle itself
                        # already adds ~2s, so 1.5s here keeps the transitional
                        # screen responsive without hammering the CPU.
    done_when:
      window_present: Minecraft

  - name: xbox_home
    description: >
      General Xbox fallback - the app is open on some non-card screen (home,
      library, store...). This is intentionally the LAST Xbox state and matches
      any Xbox window that the specific states above did not claim, so we always
      fall back to running a search. (The home page legitimately shows "Play" on
      game tiles, so we do NOT filter on button text here.)
    detect:
      window_present: XBOX
    action:
      op: search
      query: minecraft for windows
    done_when:
      any_text: ["minecraft", "results", "games"]

  - name: desktop
    description: Neither the Xbox app nor Minecraft is open yet (fallback).
    detect:
      window_absent: ["XBOX", "Minecraft"]
    action:
      op: launch_xbox
    done_when:
      window_present: XBOX
